<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>sw project - Conimal</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Custom Google font-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="http://localhost:3000/static/conimal_css/styles.css" rel="stylesheet" />
    </head>
    <body class="d-flex flex-column h-100 bg-light">
        <main class="flex-shrink-0">
            <!-- Navigation-->
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
                <div class="container px-5">
                    <a class="navbar-brand" href="http://localhost:3000/static/main.html"><span class="fw-bolder text-primary">Conimal</span></a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 small fw-bolder">
                            <li class="nav-item"><a class="nav-link" href="http://203.234.62.94/map">지도</a></li>
                            <li class="nav-item"><a class="nav-link" href="http://localhost:3000/notice/">자유게시판</a></li>
                            <li class="nav-item"><a class="nav-link" href="http://localhost:3000/mypage/">마이페이지</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <!-- Projects Section-->
            <section class="py-5">
                <div class="container px-5 mb-5">
                    <div class="text-center mb-5">
                        <h1 class="display-5 fw-bolder mb-0"><span class="text-gradient d-inline">마이페이지</span></h1>
                    </div>
                    <div class="container white-box">
                        <div class="row">
                            <div class="col-md-8 profile-simple">
                                <div class="d-flex">
                                    <div class="flex-grow-1 ms-3">
                                        <h3 id="nameText">뽀삐</h3>
                                        <br/>
                                        <div class="panel-body homebody">
                                            <form id="profileForm">
                                                <div class="row">
                                                    <div class="col-6_2"><p>Sex</p></div>
                                                    <div class="col-6_2"><input type="text" name="sex" value="여자아이" disabled></div>
                                                    <div class="col-6_2"><p>age</p></div>
                                                    <div class="col-6_2"><input type="text" name="age" value="3살" disabled></div>
                                                    <div class="col-6_2"><p>Introduce</p></div>
                                                    <div class="col-6_2">
                                                        <textarea placeholder="내용 입력" type="text" name="introduce" style="height: 300%">저의 이름은 뽀삐입니당. 저는 산책하는 것을 좋아합니다!!</textarea>
                                                    </div>
                                                    <div class="col-12 mt-3">
                                                        <button type="submit" class="btn text-white" style="background-color: #6fbaf8" disabled>
                                                            <a class="nav-link" href="http://localhost:3000/mypage/">저장</a>
                                                        </button>
                                                        <button type="button" class="btn text-white" style="background-color: #6fbaf8" onclick="cancelEdit()">
                                                            <a class="nav-link" href="http://localhost:3000/mypage/">취소</a>
                                                        </button>
                                                    </div>
                                                </div>
                                            </form>
                                        </div>
                                        <button class="btn text-white mt-3" style="background-color: #6fbaf8" onclick="editProfile()">수정하기</button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4 border-left">
                                <div class="row profile-detail">
                                    <img class="img-fluid" src="http://localhost:3000/static/assets/dog.jpg" alt="..." />
                                </div>
                            </div>
                        </div>
                    </div>
                
                
                </div>
            </section>
        </main>
        <!-- Footer-->
        <footer class="bg-white py-4 mt-auto">
            <div class="container px-5">
                <div class="row align-items-center justify-content-between flex-column flex-sm-row">
                    <div class="col-auto"><div class="small m-0">Copyright &copy; Your Website 2023</div></div>
                    <div class="col-auto">
                    </div>
                </div>
            </div>
        </footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
        <script src="http://localhost:3000/static/js/scripts.js"></script>
        <script>
            function editProfile() {
                // 프로필 수정 가능 상태로 변경
                const inputs = document.querySelectorAll('#profileForm input');
                inputs.forEach(input => {
                    input.disabled = false;
                });
    
                const saveButton = document.querySelector('#profileForm button[type="submit"]');
                const cancelButton = document.querySelector('#profileForm button[type="button"]');
                saveButton.disabled = false;
                cancelButton.disabled = false;
    
                const nameText = document.getElementById('nameText');
                nameText.contentEditable = true;
                nameText.style.border = '1px solid #ddd';
                nameText.style.padding = '5px';

                const introText = document.getElementById('introText');
                introText.contentEditable = true;
                introText.style.border = '1px solid #ddd';
                introText.style.padding = '5px';
            }
    
            function cancelEdit() {
                // 프로필 수정 취소 및 비활성 상태로 변경
                const inputs = document.querySelectorAll('#profileForm input');
                inputs.forEach(input => {
                    input.disabled = true;
                });
    
                const saveButton = document.querySelector('#profileForm button[type="submit"]');
                const cancelButton = document.querySelector('#profileForm button[type="button"]');
                saveButton.disabled = true;
                cancelButton.disabled = true;
    
                const nameText = document.getElementById('nameText');
                nameText.contentEditable = false;
                nameText.style.border = 'none';
                nameText.style.padding = '0';
            }
        </script>
    
    </body>
</html>
